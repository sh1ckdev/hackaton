components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    AuthSuccess:
      description: Успешная авторизация
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
              refresh_token: { type: string }
              user: { $ref: '#/components/schemas/User' }
  schemas:
    StatusOk:
      type: object
      properties:
        status: { type: string, example: ok }
    ParticipantCategory:
      type: string
      enum: [student, school]
      nullable: true
    User:
      type: object
      properties:
        id: { type: integer }
        telegram_id: { type: string, nullable: true }
        vk_id: { type: string, nullable: true }
        username: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        photo_url: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        role: { type: string, enum: [user, moderator, admin] }
        participant_category: { $ref: '#/components/schemas/ParticipantCategory' }
        bio: { type: string, nullable: true }
        skills:
          type: array
          items: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Case:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        requirements: { type: string, nullable: true }
        participant_category: { $ref: '#/components/schemas/ParticipantCategory' }
        links:
          type: array
          items: { type: object }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Solution:
      type: object
      properties:
        id: { type: integer }
        team_id: { type: integer }
        user_id: { type: integer }
        case_id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        github_url: { type: string, nullable: true }
        demo_url: { type: string, nullable: true }
        presentation_file_path: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, reviewing, approved, rejected]
        admin_comment: { type: string, nullable: true }
        score: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
