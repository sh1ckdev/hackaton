version: "3.9"

services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
        ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - frontend-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.frontend-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.frontend-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.frontend-ratelimit.ratelimit.burst=200"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.middlewares=frontend-ratelimit"

networks:
  frontend-network:
    name: hackathon-frontend
    driver: bridge
  dokploy-network:
    external: true