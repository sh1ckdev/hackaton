services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: hackathon-backend
    env_file:
      - ".env"
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@hackathon-db:5432/hackathon_db}
      JWT_SECRET: ${JWT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLIENT_URL: ${CLIENT_URL:-https://chermanx.ru}
      NODE_ENV: ${NODE_ENV:-production}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MAIN_ADMIN_TELEGRAM_ID: ${MAIN_ADMIN_TELEGRAM_ID:-}
    ports:
      - "${BACKEND_PORT:-5000}:3001"
    networks:
      - hackathon-db-network
      - dokploy-network
    restart: unless-stopped

networks:
  hackathon-db-network:
    external: true
  dokploy-network:
    external: true
