services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: hackathon-backend
    env_file:
      - ".env"
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@127.0.0.1:${DB_PORT:-5432}/${DB_NAME:-hackathon_db}
      JWT_SECRET: ${JWT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLIENT_URL: ${CLIENT_URL:-https://chermanx.ru}
      NODE_ENV: ${NODE_ENV:-production}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MAIN_ADMIN_TELEGRAM_ID: ${MAIN_ADMIN_TELEGRAM_ID:-}
      DB_NAME: ${DB_NAME:-hackathon_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${BACKEND_PORT:-5000}:3001"
    networks:
      - dokploy-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
