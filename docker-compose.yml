version: "3.9"

services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    networks:
      - frontend-network

networks:
  frontend-network:
    name: hackathon-frontend
    driver: bridge