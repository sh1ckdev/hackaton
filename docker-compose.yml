services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME:-dgtuHackathon_bot}
        - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-https://chermanx.ru}
        - VITE_API_URL=${VITE_API_URL:-https://api.chermanx.ru/api}
        - ALLOWED_HOSTS=${ALLOWED_HOSTS:-chermanx.ru,www.chermanx.ru}
    container_name: hackathon-frontend
    env_file:
      - ".env"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s