services:
  db:
    image: postgres:16-alpine
    container_name: hackathon-db
    env_file:
      - ".env"
    environment:
      POSTGRES_DB: ${DB_NAME:-hackathon_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - hackathon_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    networks:
      - db-network
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hackathon_db:

networks:
  db-network:
    name: hackathon-db-network
    driver: bridge
  dokploy-network:
    external: true
