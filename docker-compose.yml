services:
  backend:
    build:
      context: .
    container_name: hackathon-backend
    env_file:
      - ".env"
    environment:
      PORT: ${PORT:-5000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hackathon_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLIENT_URL: ${CLIENT_URL:-https://chermanx.ru}
      NODE_ENV: ${NODE_ENV:-production}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-600000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-60}
      SLOWDOWN_WINDOW_MS: ${SLOWDOWN_WINDOW_MS:-600000}
      SLOWDOWN_AFTER: ${SLOWDOWN_AFTER:-100}
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - internal

  db:
    image: postgres:16-alpine
    container_name: hackathon-db
    env_file:
      - ".env"
    environment:
      POSTGRES_DB: ${DB_NAME:-hackathon_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - hackathon_db:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  hackathon_db:

networks:
  internal:
    driver: bridge
