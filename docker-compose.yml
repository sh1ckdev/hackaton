services:
  frontend:
    build:
      context: .
      args:
        - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
        - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
        - FRONTEND_URL=${FRONTEND_URL:-}
        - API_URL=${API_URL:-https://chermanx.ru/api}
    container_name: hackathon-frontend
    env_file:
      - ".env"
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s