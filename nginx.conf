server {
  listen 4173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: любые пути (например /cases) отдаём через index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Кэш для статики (Vite кладёт хэш в имена файлов)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

